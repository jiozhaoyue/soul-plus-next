name: Release & Distribution

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Userscripts
        run: |
          test -f soul-plus-next.user.js
          test -f soul-plus-next.bugfix.user.js
          test -f soul-plus-next.original.user.js
          echo "Userscript files exist and are ready for distribution."

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            soul-plus-next.user.js
            soul-plus-next.bugfix.user.js
          generate_release_notes: true
